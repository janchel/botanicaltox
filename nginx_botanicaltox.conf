# =============================================================================
# CRABLOX — Nginx Reverse Proxy Configuration (sample)
# -----------------------------------------------------------------------------
# TOPOLOGY:
#     Internet ──> [Public nginx server] ──> 10.200.200.4:5001 (CRABLOX)
#
# nginx runs on a PUBLIC-facing server; the Flask app (Gunicorn) runs on the
# INTERNAL server 10.200.200.4.
#
# On the internal server (10.200.200.4), run Gunicorn bound to all interfaces
# (do NOT use the Flask dev server):
#     source venv/bin/activate
#     gunicorn -w 4 -b 0.0.0.0:5001 app:app
#
# Install this site config on the PUBLIC nginx server:
#     sudo cp nginx_botanicaltox.conf /etc/nginx/sites-available/botanicaltox
#     sudo ln -s /etc/nginx/sites-available/botanicaltox /etc/nginx/sites-enabled/
#     sudo nginx -t
#     sudo systemctl reload nginx
#
# Replace "botanicaltox.example.com" with your real domain.
# =============================================================================

upstream crablox_app {
    # Backend = Gunicorn on the INTERNAL server.
    server 10.200.200.4:5001;
    keepalive 32;                       # reuse backend connections
}

# ---- HTTP → HTTPS redirect (optional; enable once SSL is set up) ----
# server {
#     listen 80;
#     server_name botanicaltox.example.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    # listen 443 ssl http2;             # enable once you have certificates
    server_name botanicaltox.example.com;

    # ---- SSL (uncomment with your certificate paths) ----
    # ssl_certificate     /etc/letsencrypt/live/botanicaltox.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/botanicaltox.example.com/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;

    # The app allows uploads up to 50 MB — match that here (add a little headroom).
    client_max_body_size 55m;

    # ── App routes: forward everything to Flask ──────────────────────────────
    location / {
        proxy_pass         http://crablox_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";   # needed for keepalive upstream
        proxy_read_timeout 300s;                  # training/prediction can be slow
    }

    # ── AI explanation endpoint (Server-Sent Events) ─────────────────────────
    # SSE must NOT be buffered, or the streamed explanation stalls.
    location /explain {
        proxy_pass         http://crablox_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;                 # stream tokens as they arrive
        proxy_cache        off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ── Optional: let nginx serve the project README/static docs directly ────
    # location = /README.md {
    #     root /home/jandel/devops/my-github/botanicaltox;
    #     types { text/markdown md; }
    # }
}

# =============================================================================
# IMPORTANT NOTES (two-server topology)
# -----------------------------------------------------------------------------
# 1. INTERNAL app server (10.200.200.4):
#    • Run Gunicorn on 0.0.0.0:5001 so nginx can reach it over the private net:
#          gunicorn -w 4 -b 0.0.0.0:5001 app:app
#    • Firewall: allow TCP 5001 ONLY from the nginx server's IP. Block it from
#      the public internet. Example (ufw on the internal server):
#          sudo ufw allow from <PUBLIC_NGINX_IP> to any port 5001 proto tcp
#      All other external access to 5001 should be denied.
#
# 2. PUBLIC nginx server:
#    • This config proxies / and /explain to 10.200.200.4:5001.
#    • Ports 80 (and 443 if using HTTPS) are the only things exposed publicly.
#
# 3. Trusted proxies: since nginx sets X-Forwarded-*, tell Flask to trust it
#    so request.scheme / session cookies behave over HTTPS. In app.py add:
#
#        from werkzeug.middleware.proxy_fix import ProxyFix
#        app.wsgi_app = ProxyFix(app.wsgi_app, x_proto=1, x_host=1)
#
# 4. Session cookies: with HTTPS you may want:
#        app.config["SESSION_COOKIE_SECURE"] = True
#        app.config["SESSION_COOKIE_HTTPONLY"] = True
#        app.config["SESSION_COOKIE_SAMESITE"] = "Lax"
#
# 5. Static files: this app renders templates server-side and serves avatars
#    via the /avatar route, so no separate static block is required.
#
# 6. Health check (optional):
#        location /health { proxy_pass http://crablox_app; }
#    (add a /health route in app.py returning 200)
# =============================================================================
