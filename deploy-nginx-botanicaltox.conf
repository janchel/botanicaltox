# CRABLOX — nginx reverse proxy sample
# Place in /etc/nginx/sites-available/botanicaltox.rebelstack.fun on the
# public-facing nginx server, then symlink into sites-enabled:
#   ln -s /etc/nginx/sites-available/botanicaltox.rebelstack.fun /etc/nginx/sites-enabled/
# Run `./run.sh --prod` on the app server (10.200.200.3) before reloading nginx.

# HTTP -> HTTPS redirect (certbot uses this for ACME challenges)
server {
    listen 80;
    server_name botanicaltox.rebelstack.fun;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name botanicaltox.rebelstack.fun;

    ssl_certificate     /etc/letsencrypt/live/botanicaltox.rebelstack.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/botanicaltox.rebelstack.fun/privkey.pem;

    client_max_body_size 50m;   # match app's 50 MB upload limit

    location / {
        proxy_pass http://10.200.200.3:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
